# Metric registry. Every number on the dashboard, in Power BI, in the Excel workbook and in the memo is computed
# from a definition in this file, by src/metrics.py. Define a metric once; every consumer reads the same output.
#
# A ratio metric is published as numerator and denominator, so any tool can re-aggregate it correctly
# (sum the parts, then divide; never average the ratios). Counts and sums have an empty denominator: just sum them.

snapshot:
  city: London
  source: Inside Airbnb
  scraped: "18-22 September 2026"

parameters:
  # Inside Airbnb's occupancy model, reproduced exactly from the raw reviews (see docs/occupancy-model.md)
  review_rate: 0.5          # share of stays that leave a review
  avg_stay_nights: 4.6      # average London stay; a listing's minimum stay is used if it is longer
  occupancy_cap: 0.70       # no listing is modelled above 70% of the year (255 nights)
  short_let_limit_nights: 90  # Greater London: short lets of an entire home above 90 nights a year need planning permission

dimensions:
  total:      {column: "'London'", label: "All of London"}
  borough:    {column: borough, label: "Borough"}
  room_type:  {column: room_type, label: "Room type"}
  host_size:  {column: host_size, label: "Host size", order: ["1 listing", "2-4 listings", "5-19 listings", "20+ listings"]}

metrics:
  - id: listings
    name: Listings
    description: Every listing in the snapshot, whether or not anyone has stayed recently.
    type: count
    certified: true
    version: 1

  - id: active_listings
    name: Active listings
    description: Listings with at least one review in the last 12 months. Most dormant listings never get booked.
    type: count
    filter: is_active
    certified: true
    version: 1

  - id: occupancy_rate
    name: Occupancy rate
    description: Modelled booked nights in the last 12 months, as a share of the year, for active listings.
    type: ratio
    numerator: sum(modelled_nights)
    denominator: 365 * count(*)
    filter: is_active
    format: percent
    certified: true
    version: 2
    changelog:
      - version: 1
        change: Denominator counted every listing, including dormant ones. Gave 13.5% and made London look empty.
      - version: 2
        change: Active listings only, so the rate describes listings that are actually trading.

  - id: nights_booked
    name: Nights booked (modelled)
    description: Modelled booked nights in the last 12 months, active listings.
    type: sum
    expression: modelled_nights
    filter: is_active
    certified: true
    version: 1

  - id: entire_home_share
    name: Entire-home share
    description: Share of active listings that are a whole home or flat, the type the 90-night rule is about.
    type: ratio
    numerator: count(*) filter (where is_entire_home)
    denominator: count(*)
    filter: is_active
    format: percent
    certified: true
    version: 1

  - id: multi_listing_share
    name: Multi-listing host share
    description: Share of active listings run by a host with two or more London listings.
    type: ratio
    numerator: count(*) filter (where host_listings >= 2)
    denominator: count(*)
    filter: is_active
    format: percent
    certified: true
    version: 1

  - id: over_90_homes
    name: Entire homes likely over 90 nights
    description: Active entire homes, offered for short stays (minimum under 90 nights), modelled above 90 booked nights in the last 12 months.
    type: count
    filter: is_active and is_entire_home and is_short_let and modelled_nights > 90
    certified: true
    version: 1

  - id: over_90_share
    name: Share of entire homes likely over 90 nights
    description: Over-90 entire homes as a share of active short-stay entire homes.
    type: ratio
    numerator: count(*) filter (where modelled_nights > 90)
    denominator: count(*)
    filter: is_active and is_entire_home and is_short_let
    format: percent
    certified: true
    version: 1

  # ---- Other ways teams measure "occupancy". Kept so the conflict is visible, never shown as the answer.
  - id: occupancy_calendar_unavailable
    name: "Occupancy: calendar unavailable"
    description: Share of the next 365 days that are not open on the calendar, all listings.
    type: ratio
    numerator: sum(nights_unavailable)
    denominator: sum(calendar_nights)
    format: percent
    certified: false
    why_not: The calendar cannot tell a booked night from one the host blocked, and it looks forward, not back. A dormant listing with a closed calendar looks fully booked.

  - id: occupancy_all_listings
    name: "Occupancy: modelled, all listings"
    description: Modelled booked nights as a share of the year, counting dormant listings too.
    type: ratio
    numerator: sum(modelled_nights)
    denominator: 365 * count(*)
    format: percent
    certified: false
    why_not: Half of all listings had no stay in a year. Counting them describes the size of the listing site, not how busy short lets are. This was version 1 of the certified metric.

  - id: occupancy_of_bookable
    name: "Occupancy: booked share of bookable nights"
    description: Modelled booked nights divided by modelled booked plus open nights, active listings.
    type: ratio
    numerator: sum(modelled_nights)
    denominator: sum(modelled_nights + nights_open)
    filter: is_active
    format: percent
    certified: false
    why_not: Mixes a backward-looking estimate (last 12 months) with a forward-looking calendar (next 12 months), so the two halves describe different years.

publish:
  # which metric x dimension combinations the consumers get
  dimensions: [total, borough, room_type, host_size]
  crosses: [[borough, room_type]]

checks:
  # error = stop, nothing is published. warn = publish and flag.
  - {id: unique_listing, severity: error, sql: "select count(*) - count(distinct listing_id) from stg_listings", expect: 0,
     description: "Each listing appears once"}
  - {id: borough_known, severity: error, sql: "select count(*) from stg_listings where borough is null", expect: 0,
     description: "Every listing has a borough"}
  - {id: thirty_three_boroughs, severity: error, sql: "select count(distinct borough) from stg_listings", expect: 33,
     description: "Exactly 33 London boroughs (32 plus the City)"}
  - {id: inside_london, severity: error, sql: "select count(*) from stg_listings where latitude not between 51.25 and 51.75 or longitude not between -0.56 and 0.34", expect: 0,
     description: "Coordinates fall inside Greater London's bounding box"}
  - {id: has_calendar, severity: error, sql: "select count(*) from fct_listing where calendar_nights is null", expect: 0,
     description: "Every listing has a calendar"}
  - {id: full_calendar, severity: warn, sql: "select count(*) from fct_listing where calendar_nights <> 365", expect: 0,
     description: "Every listing has 365 calendar nights from the day its calendar was scraped"}
  - {id: reviews_rebuilt, severity: error, sql: "select count(*) from fct_listing where reviews_ltm <> coalesce(reviews_ltm_source, 0)", expect: 0,
     description: "Reviews in the last 12 months, rebuilt from the raw review log, match the listings file"}
  - {id: model_reproduced, severity: error, sql: "select count(*) from fct_listing where modelled_nights <> coalesce(est_nights_source, 0)", expect: 0,
     description: "Modelled nights reproduce Inside Airbnb's own occupancy estimate for every listing"}
  - {id: availability_matches, severity: warn, sql: "select count(*) from fct_listing where nights_open <> availability_365_source", expect: 0,
     description: "Open calendar nights match the listings file's availability_365"}
  - {id: minimum_nights_sane, severity: warn, sql: "select count(*) from stg_listings where minimum_nights is null or minimum_nights < 1 or minimum_nights > 1125", expect: 0,
     description: "Minimum stay is between 1 and 1,125 nights (blank in the source for some listings: they are not counted as short lets)"}
